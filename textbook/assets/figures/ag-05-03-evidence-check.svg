<svg xmlns="http://www.w3.org/2000/svg" width="880" height="920" viewBox="0 0 880 920" role="img" aria-labelledby="title desc"><title id="title">从材料到断言的依据核查</title><desc id="desc">用来源与版本核对具体断言；支持则保留，冲突则修正，未说明则保留未知或补充证据。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1D2433" stroke-width="1.4"/></marker></defs><rect width="880" height="920" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433"><text x="48" y="62" font-size="27" font-weight="700">让每项判断回到具体依据</text>
<rect x="48" y="108" width="350" height="142" rx="12" fill="#DDEDE7"/><text x="72" y="150" font-size="24" font-weight="700">来源材料</text><text x="72" y="188" font-size="20">确实存在？对应哪个版本？</text><text x="72" y="222" font-size="20">相关位置究竟说了什么？</text>
<rect x="482" y="108" width="350" height="142" rx="12" fill="#E6E1F5"/><text x="506" y="150" font-size="24" font-weight="700">生成候选</text><text x="506" y="188" font-size="20">拆出可核对的具体断言</text><text x="506" y="222" font-size="20">把事实与建议分开</text>
<g stroke="#1D2433" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M223 250 V310 H320 V342"/><path d="M657 250 V310 H560 V342"/></g>
<rect x="170" y="342" width="540" height="90" rx="12" fill="#fff" stroke="#1D2433"/><text x="440" y="396" text-anchor="middle" font-size="25">这份材料足以支持这句话吗？</text>
<g fill="none" stroke="#1D2433" stroke-width="2" marker-end="url(#a)"><path d="M440 432 V476 H164 V510"/><path d="M440 432 V510"/><path d="M440 432 V476 H716 V510"/></g>
<rect x="48" y="510" width="232" height="175" rx="12" fill="#DDEDE7"/><rect x="324" y="510" width="232" height="175" rx="12" fill="#F9E4DA"/><rect x="600" y="510" width="232" height="175" rx="12" fill="#E6E1F5"/>
<g text-anchor="middle"><g font-size="24" font-weight="700"><text x="164" y="556">材料支持</text><text x="440" y="556">材料冲突</text><text x="716" y="556">材料未说明</text></g><g font-size="20"><text x="164" y="602">保留断言</text><text x="164" y="638">注明来源与范围</text><text x="440" y="602">修正具体内容</text><text x="440" y="638">重新核对依据</text><text x="716" y="602">保留未知</text><text x="716" y="638">或补充可靠材料</text></g></g>
<text x="48" y="753" font-size="21">例：“持续更新”不能被改写成“已经全部完成”。</text><text x="48" y="791" font-size="20">链接能打开，只完成了核查的一步。</text><text x="48" y="853" font-size="20" font-weight="700">AG-05-03　从材料到断言的依据核查</text><text x="48" y="887" font-size="17">课程原创方法图；配合 AIInfra 阅读卡和教学候选使用。</text></g></svg>
