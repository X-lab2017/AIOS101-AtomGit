<svg xmlns="http://www.w3.org/2000/svg" width="880" height="820" viewBox="0 0 880 820" role="img"><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#1D2433;font-size:28px}.small{font-size:25px}.heading{font-size:36px;font-weight:700}.bold{font-weight:700}</style><rect width="100%" height="100%" rx="20" fill="#F6F3EB"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#5146D9"/></marker></defs><text x="42" y="60" class="heading">同一个参数，改变整条预测线</text><text x="42" y="104">圆点是 A/B/C；线是三种候选规则</text><line x1="100" y1="590.0" x2="690" y2="590.0" stroke="#D8D6CF"/><text x="76" y="600.0" text-anchor="end">0</text><line x1="100" y1="494.0" x2="690" y2="494.0" stroke="#D8D6CF"/><text x="76" y="504.0" text-anchor="end">30</text><line x1="100" y1="398.0" x2="690" y2="398.0" stroke="#D8D6CF"/><text x="76" y="408.0" text-anchor="end">60</text><line x1="100" y1="302.0" x2="690" y2="302.0" stroke="#D8D6CF"/><text x="76" y="312.0" text-anchor="end">90</text><line x1="100" y1="206.0" x2="690" y2="206.0" stroke="#D8D6CF"/><text x="76" y="216.0" text-anchor="end">120</text><text x="42" y="165">秒</text><path d="M100 185 V590 H710" fill="none" stroke="#1D2433" stroke-width="2"/><text x="100.0" y="635" text-anchor="middle">0</text><text x="285.0" y="635" text-anchor="middle">100</text><text x="470.0" y="635" text-anchor="middle">200</text><text x="655.0" y="635" text-anchor="middle">300</text><text x="730" y="635">字</text><line x1="100" y1="590" x2="655.0" y2="398.0" stroke="#5146D9" stroke-width="5"/><text x="700" y="408.0" style="fill:#5146D9">a=20</text><line x1="100" y1="590" x2="655.0" y2="302.0" stroke="#3F958D" stroke-width="5"/><text x="700" y="312.0" style="fill:#3F958D">a=30</text><line x1="100" y1="590" x2="655.0" y2="206.0" stroke="#8A8B91" stroke-width="5"/><text x="700" y="216.0" style="fill:#8A8B91">a=40</text><circle cx="285.0" cy="494.0" r="9" fill="#1D2433"/><text x="260.0" y="474.0">A</text><circle cx="470.0" cy="398.0" r="9" fill="#1D2433"/><text x="445.0" y="378.0">B</text><circle cx="655.0" cy="302.0" r="9" fill="#1D2433"/><text x="630.0" y="282.0">C</text><path d="M470.0 462.0 V398.0" stroke="#F27A59" stroke-width="7"/><text x="490" y="525" style="fill:#AF4C34">相差 20 秒</text><text x="42" y="700" class="bold">看 B：a=20 预测 40 秒，参照是 60 秒。</text><text x="42" y="747">把 a 调到 30，三个圆点都落在预测线上。</text><text x="42" y="790" class="small">教学合成数据；不表示真实阅读速度。</text></svg>