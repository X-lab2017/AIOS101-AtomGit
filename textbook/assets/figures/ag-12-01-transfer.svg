<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1030" viewBox="0 0 800 1030" role="img" aria-labelledby="title desc"><title id="title">方法可以迁移，条件必须重查</title><desc id="desc">旧作品的经验与新任务的条件共同进入判断；保留方法、调整步骤、完成新尝试，再以实际结果修订能力说明。</desc><rect width="800" height="1030" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="34" fill="#1D2433" font-weight="700">带走方法，重新建立结论</text><text x="48" y="104" font-size="26" fill="#1D2433" font-weight="400">迁移需要比较条件，并实际检验。</text><rect x="48" y="150" width="328" height="196" rx="12" fill="#EBE8FA" stroke="#5146D9" stroke-width="2"/><text x="72" y="193" font-size="29" fill="#5146D9" font-weight="700">旧作品的经验</text><text x="72" y="243" font-size="27" fill="#1D2433" font-weight="400">DSH 观察站</text><text x="72" y="285" font-size="25" fill="#1D2433" font-weight="400">对象、条件与入口</text><text x="72" y="325" font-size="25" fill="#1D2433" font-weight="400">已有行动与证据</text><rect x="424" y="150" width="328" height="196" rx="12" fill="#F9E7DE" stroke="#B65539" stroke-width="2"/><text x="448" y="193" font-size="29" fill="#98462E" font-weight="700">新任务的条件</text><text x="448" y="243" font-size="27" fill="#1D2433" font-weight="400">另一个 AI 项目</text><text x="448" y="285" font-size="25" fill="#1D2433" font-weight="400">对象可能不同</text><text x="448" y="325" font-size="25" fill="#1D2433" font-weight="400">材料需要重新查</text><path d="M210 346 L210 400" stroke="#5146D9" stroke-width="3" fill="none"/><path d="M590 346 L590 400" stroke="#B65539" stroke-width="3" fill="none"/><path d="M210 400 L590 400" stroke="#5146D9" stroke-width="3" fill="none"/><path d="M400 400 L400 442" stroke="#5146D9" stroke-width="3" fill="none"/><rect x="85" y="442" width="630" height="170" rx="12" fill="#FFFFFF" stroke="#5146D9" stroke-width="2"/><text x="112" y="487" font-size="31" fill="#1D2433" font-weight="700">保留方法，调整步骤</text><text x="112" y="535" font-size="27" fill="#1D2433" font-weight="400">先辨认对象，再查来源与条件</text><text x="112" y="579" font-size="26" fill="#1D2433" font-weight="400">不能只替换项目名或照搬结论</text><path d="M400 612 L400 668" stroke="#5146D9" stroke-width="3" fill="none"/><rect x="85" y="668" width="630" height="160" rx="12" fill="#E8F0EB" stroke="#3F958D" stroke-width="2"/><text x="112" y="714" font-size="31" fill="#24675F" font-weight="700">做一次新的尝试</text><text x="112" y="758" font-size="26" fill="#1D2433" font-weight="400">形成小成果，按预定办法检查</text><text x="112" y="801" font-size="25" fill="#1D2433" font-weight="400">说明结果、差异与仍未验证的部分</text><path d="M715 748 H760 V920 H85" fill="none" stroke="#3F958D" stroke-width="3"/><text x="85" y="896" font-size="28" fill="#1D2433" font-weight="700">用新发现修订自己的技能条目</text><text x="48" y="982" font-size="24" fill="#1D2433" font-weight="400">阅读证据支持文档判断；运行效果需要运行证据。</text></g></svg>