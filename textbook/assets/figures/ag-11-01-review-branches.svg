<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1160" viewBox="0 0 800 1160" role="img" aria-labelledby="title desc"><title id="title">修改先被讨论，再进入共同版本</title><desc id="desc">共同版本与修改分支从同一基线出发；在分支提交并以PR讨论，按规则和权限合并后再核对。Fork作为没有原仓库写权限时的可选路径。</desc><rect width="800" height="1160" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="33" fill="#1D2433" font-weight="700">让改动先被看见，再共同采用</text><text x="48" y="104" font-size="26" fill="#1D2433" font-weight="400">文档、图解与程序，都可以这样协作。</text><text x="50" y="176" font-size="29" fill="#5146D9" font-weight="700">共同版本</text><text x="480" y="176" font-size="29" fill="#3F958D" font-weight="700">修改分支</text><path d="M110 220 L110 880" stroke="#5146D9" stroke-width="3" fill="none"/><path d="M605 300 L605 605" stroke="#3F958D" stroke-width="3" fill="none"/><path d="M110 250 C110 295 605 235 605 300" stroke="#3F958D" stroke-width="3" fill="none"/><text x="165" y="243" font-size="25" fill="#1D2433" font-weight="400">从约定版本开始</text><circle cx="110" cy="250" r="13" fill="#5146D9"/><circle cx="110" cy="535" r="13" fill="#5146D9"/><circle cx="605" cy="340" r="13" fill="#3F958D"/><circle cx="605" cy="500" r="13" fill="#3F958D"/><circle cx="110" cy="880" r="13" fill="#5146D9"/><rect x="370" y="365" width="380" height="96" rx="12" fill="#E8F0EB" stroke="#3F958D" stroke-width="2"/><text x="394" y="403" font-size="29" fill="#1D2433" font-weight="700">修改并提交</text><text x="394" y="440" font-size="24" fill="#1D2433" font-weight="400">例如修复一个文档链接</text><text x="148" y="523" font-size="26" fill="#1D2433" font-weight="400">读者仍可使用</text><text x="148" y="562" font-size="26" fill="#1D2433" font-weight="400">现有内容</text><rect x="292" y="590" width="458" height="150" rx="12" fill="#FFFFFF" stroke="#3F958D" stroke-width="2"/><text x="318" y="629" font-size="27" fill="#1D2433" font-weight="700">PR：请求把修改合进来</text><text x="318" y="671" font-size="25" fill="#1D2433" font-weight="400">读差异、检查结果、讨论</text><text x="318" y="710" font-size="25" fill="#1D2433" font-weight="400">有必要就修订，再检查</text><path d="M605 740 V770 H110 V880" stroke="#F27A59" stroke-width="3" stroke-dasharray="8 7" fill="none"/><text x="245" y="817" font-size="25" fill="#1D2433" font-weight="400">符合规则后，由有权限的人合并</text><text x="148" y="887" font-size="29" fill="#1D2433" font-weight="700">共同版本纳入改动，再复查</text><path d="M48 942 L752 942" stroke="#B7B3AA" stroke-width="3" fill="none"/><text x="48" y="986" font-size="27" fill="#1D2433" font-weight="700">没有写权限？</text><text x="48" y="1028" font-size="26" fill="#1D2433" font-weight="400">若项目允许，可在自己的 Fork 中修改，</text><text x="48" y="1068" font-size="26" fill="#1D2433" font-weight="400">再向原项目提出 PR；否则按规则反馈。</text><text x="48" y="1120" font-size="24" fill="#1D2433" font-weight="400">创建请求 ≠ 已合并；关闭请求也可能未合并。</text></g></svg>