<text x="150" y="308" font-size="44">本版本暂不接收外部 PR；</text>
<text x="150" y="375" font-size="44">欢迎指南、答疑等帮助。</text>
<text x="150" y="439" font-size="35" fill="#626878">记录作者的说法与材料位置。</text>
<path d="M148 482 Q313 477 501 483" fill="none" stroke="#D7E9E3" stroke-width="29"/>
<text x="150" y="495" font-size="45" font-weight="700" fill="#2D716A">我的观察</text>
<text x="150" y="574" font-size="44">我在贡献指南中，</text>
<text x="150" y="641" font-size="44">读到了这项说明。</text>
<text x="150" y="705" font-size="35" fill="#626878">记录实际阅读，不替代运行。</text>
<path d="M148 748 Q356 740 603 749" fill="none" stroke="#F8DCCF" stroke-width="29"/>
<text x="150" y="762" font-size="45" font-weight="700" fill="#A74831">待验证判断</text>
<text x="150" y="840" font-size="44">一份新手指南，</text>
<text x="150" y="907" font-size="44">可能帮助初次接触的同学。</text>
<text x="150" y="971" font-size="35" fill="#626878">下一步：收集实际读者反馈。</text>
<text x="936" y="1005" text-anchor="end" font-size="23" fill="#626878">示例写法 · 请据实记录</text>
</g></svg>