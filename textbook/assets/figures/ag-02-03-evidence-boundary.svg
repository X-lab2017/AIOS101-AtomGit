<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc">
<title id="title">同一条线索，分开记录说明、观察与判断</title>
<desc id="desc">项目说明是暂不接受外部 PR、欢迎指南等帮助；个人阅读观察是自己在贡献指南中读到这项说明；新手指南可能帮助同学，则仍是需要实际读者反馈的判断。示例不代表运行或贡献已经完成。</desc>
<rect width="1000" height="1050" fill="#F6F3EB"/>
<path d="M35 28 L961 34 L969 1020 L29 1013 Z" fill="#FEFCF6" stroke="#B6B2A6" stroke-width="2"/>
<g stroke="#E4E0D5" stroke-width="2"><path d="M46 318H953 M46 385H953 M46 452H953 M46 584H953 M46 651H953 M46 718H953 M46 850H953 M46 917H953"/></g>
<path d="M108 164 Q103 568 108 978" fill="none" stroke="#E7B3A3" stroke-width="2"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#1D2433">
<text x="64" y="94" font-size="42" font-weight="700">一条线索，三处记录</text>
