<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1180" viewBox="0 0 800 1180" role="img" aria-labelledby="t d">
<title id="t">一次创作中的角色与位置</title><desc id="d">人决定任务。DSH 内部组织模型提出请求、工具执行并返回结果。工具读写工作区文件。人打开保存的产物检查，之后选择是否分享到 AtomGit。本图未表示平台自动连接。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#5146D9"/></marker></defs>
<rect width="800" height="1180" fill="#F6F3EB"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433" text-anchor="middle">
<text x="400" y="60" font-size="32" font-weight="700">同一个任务，不同的职责</text>
<rect x="48" y="100" width="704" height="96" rx="14" fill="#FBE4D9" stroke="#1D2433"/>
<text x="400" y="144" font-size="30" font-weight="700">人：决定目标与取舍</text><text x="400" y="179" font-size="25">明确读者、材料与这次要做的作品</text>
<path d="M400 201 V250" stroke="#5146D9" stroke-width="3" marker-end="url(#a)"/>
<rect x="48" y="275" width="704" height="318" rx="18" fill="#ECE8FA" stroke="#5146D9" stroke-width="2"/>
<text x="400" y="320" font-size="32" font-weight="700">DSH：组织请求、执行与反馈</text>
<rect x="78" y="354" width="250" height="130" rx="12" fill="#FFFDF7" stroke="#5146D9"/>
<text x="203" y="395" font-size="31" font-weight="700">模型</text><text x="203" y="431" font-size="25">生成候选内容</text><text x="203" y="465" font-size="25">或工具请求</text>
<rect x="472" y="354" width="250" height="130" rx="12" fill="#FFFDF7" stroke="#5146D9"/>
<text x="597" y="395" font-size="31" font-weight="700">工具</text><text x="597" y="431" font-size="25">执行文件动作</text><text x="597" y="465" font-size="25">返回实际结果</text>
<path d="M334 390 H462" stroke="#5146D9" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="378" font-size="23">请求</text>
<path d="M466 458 H337" stroke="#5146D9" stroke-width="2.5" marker-end="url(#a)"/><text x="400" y="448" font-size="23">结果</text>
<text x="345" y="552" font-size="25">根据返回内容，继续下一步</text>
<path d="M597 493 V650" stroke="#5146D9" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="655" y="626" font-size="24">读写</text>
<path d="M220 676 H270 L288 692 H630 V788 H170 V692 H220 Z" fill="#E5EFEB" stroke="#3F958D" stroke-width="2"/>
<text x="400" y="729" font-size="31" font-weight="700">工作区</text><text x="400" y="767" font-size="25">存放输入材料与产物文件</text>
<path d="M400 795 V835" stroke="#5146D9" stroke-width="3" marker-end="url(#a)"/>
<rect x="48" y="857" width="704" height="88" rx="14" fill="#FBE4D9" stroke="#1D2433"/>
<text x="400" y="896" font-size="30" font-weight="700">人：打开产物，检查后决定</text><text x="400" y="931" font-size="24">保存成功，不等于内容正确或已经分享</text>
<path d="M400 951 V1028" stroke="#5146D9" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a)"/>
<text x="569" y="995" font-size="24">之后选择分享</text>
<rect x="170" y="1050" width="460" height="83" rx="12" fill="#FFFDF7" stroke="#3F958D" stroke-width="2"/>
<text x="400" y="1086" font-size="30" font-weight="700">AtomGit</text><text x="400" y="1118" font-size="24">保存版本与协作 · 第十章展开</text>
</g></svg>
