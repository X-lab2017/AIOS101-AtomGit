<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">从有依据的内容到可检查的导览</title><desc id="desc">来源记载支持作品主张；创作者增加明确标注的教学解释并决定结构；AI 形成候选，检查与反馈推动修订，新增事实需要回到来源。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#5146D9"/></marker></defs><rect width="1000" height="720" rx="20" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433"><text x="40" y="56" font-size="30" font-weight="700">把来源、解释与制作决定分清楚</text>
<rect x="40" y="94" width="440" height="152" rx="14" fill="#EBE7FB" stroke="#CDC9C0"/><text x="62" y="138" font-size="27" font-weight="700">来源记载</text><text x="62" y="181" font-size="26">B2：模型、上下文与工具的分工</text><text x="62" y="221" font-size="26">B4：工具结果进入后续输入</text>
<rect x="520" y="94" width="440" height="152" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="542" y="138" font-size="27" font-weight="700">教学解释</text><text x="542" y="181" font-size="26">一次读取：请求、返回、再生成</text><text x="542" y="221" font-size="26">注明教学构造，不能写成实跑</text>
<path d="M260 250V292" stroke="#5146D9" stroke-width="2" marker-end="url(#a)"/>
<path d="M740 250V292" stroke="#5146D9" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="300" width="920" height="150" rx="14" fill="#DDEFE9" stroke="#CDC9C0"/><text x="62" y="345" font-size="27" font-weight="700">创作者组织内容，说明为何这样安排</text><text x="62" y="389" font-size="26">读者问题 → 角色解释 → 读取例子 → 选读入口</text><text x="62" y="429" font-size="26">每一项关键说法能回到依据，自己的建议也有理由。</text>
<path d="M500 454V478H180V496" fill="none" stroke="#5146D9" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="504" width="280" height="114" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="64" y="550" font-size="26">AI 协助形成候选</text><text x="64" y="590" font-size="26">按已确认结构制作</text>
<rect x="360" y="504" width="280" height="114" rx="14" fill="#EBE7FB" stroke="#CDC9C0"/><text x="384" y="550" font-size="26">人打开并检查</text><text x="384" y="590" font-size="26">依据、图文与入口</text>
<rect x="680" y="504" width="280" height="114" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="704" y="550" font-size="26">据问题修订</text><text x="704" y="590" font-size="26">相关位置再核对</text>
<path d="M324 562H352" stroke="#5146D9" stroke-width="2" marker-end="url(#a)"/>
<path d="M644 562H672" fill="none" stroke="#5146D9" stroke-width="2" marker-end="url(#a)"/><text x="40" y="674" font-size="24" fill="#565D6A">生成次数不增加事实依据；新增事实仍须核对来源。</text></g></svg>
