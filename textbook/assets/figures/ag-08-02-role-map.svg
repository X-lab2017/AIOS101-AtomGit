<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" fill="#F6F3EB"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1D2433}.t{font-size:30px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:22px}.n{font-size:19px;fill:#566070}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5146D9" stroke-width="1.5"/></marker></defs><text x="40" y="55" class="t">从用户的选择，看见每一步的结果</text><rect x="40" y="95" width="435" height="145" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="64" y="137" class="h">① 入口：选择观察对象</text><text x="64" y="177" class="b">输入：我想理解模型，还是文件协作？</text><text x="64" y="210" class="b">输出：有区别的项目入口</text><rect x="525" y="95" width="435" height="145" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="549" y="137" class="h">② 档案：判断是否适合</text><text x="549" y="177" class="b">输入：选择 DSH</text><text x="549" y="210" class="b">输出：用途、条件、版本与来源</text><path d="M480 170 L518 170" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="315" width="435" height="145" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="64" y="357" class="h">④ 下一步：继续或返回</text><text x="64" y="397" class="b">输入：读完作品后的新问题</text><text x="64" y="430" class="b">输出：探究、准备任务或返回入口</text><rect x="525" y="315" width="435" height="145" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="549" y="357" class="h">③ 作品：读一份导览</text><text x="549" y="397" class="b">输入：选择“先读导览”</text><text x="549" y="430" class="b">输出：可读内容与任务建议</text><path d="M745 245 L745 305" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><path d="M520 390 L483 390" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="535" width="920" height="115" rx="18" fill="#E4F0ED" stroke="#D5D4CF"/><text x="64" y="577" class="h">条件不足，也有清楚出口</text><text x="64" y="617" class="b">未接入：先阅读与准备。材料缺失：说明缺口，不编造结果。</text><text x="40" y="690" class="n">背后材料：项目档案 + 已有导览 + 来源；文档版无需虚构后台。</text></svg>