<svg xmlns="http://www.w3.org/2000/svg" width="880" height="860" viewBox="0 0 880 860" role="img" aria-labelledby="title desc">
<title id="title">训练、验证与测试的分工</title><desc id="desc">三类材料分别用于调整参数、选择方案和独立检查。测试结果参与修改后，应安排新的独立检查。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1D2433" stroke-width="1.4"/></marker></defs>
<rect width="880" height="860" fill="#F6F3EB"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433"><text x="48" y="61" font-size="27" font-weight="700">同一批材料，用途必须分清</text>
<text x="48" y="98" font-size="19">先按任务合理划分；检查重复与覆盖范围</text>
<g stroke="#1D2433" stroke-width="1.5"><rect x="48" y="140" width="230" height="140" rx="12" fill="#E6E1F5"/><rect x="325" y="140" width="230" height="140" rx="12" fill="#DDEDE7"/><rect x="602" y="140" width="230" height="140" rx="12" fill="#F9E4DA"/></g>
<g font-size="24" font-weight="700" text-anchor="middle"><text x="163" y="186">训练集</text><text x="440" y="186">验证集</text><text x="717" y="186">测试集</text></g>
<g font-size="19" text-anchor="middle"><text x="163" y="224">依据样本调整参数</text><text x="163" y="252">参与学习</text><text x="440" y="224">比较方案和设置</text><text x="440" y="252">参与开发选择</text><text x="717" y="224">方案确定后评估</text><text x="717" y="252">保留独立检查</text></g>
<g fill="none" stroke="#1D2433" stroke-width="2" marker-end="url(#arrow)"><path d="M163 280 V350"/><path d="M440 280 V350"/><path d="M717 280 V470"/></g>
<rect x="48" y="350" width="507" height="80" rx="10" fill="#fff" stroke="#5146D9" stroke-width="2"/>
<text x="301" y="399" font-size="23" text-anchor="middle">形成并确定模型方案</text>
<path d="M301 430 V510 H602" fill="none" stroke="#1D2433" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="602" y="470" width="230" height="80" rx="10" fill="#fff" stroke="#F27A59" stroke-width="2"/>
<text x="717" y="519" text-anchor="middle" font-size="23">检查表现与范围</text>
<rect x="48" y="600" width="784" height="130" rx="12" fill="#fff" stroke="#CCC6BA"/>
<text x="72" y="638" font-size="22" font-weight="700">如果检查结果又影响了修改……</text><text x="72" y="674" font-size="20">它就进入了开发过程。保留这次反馈，</text><text x="72" y="705" font-size="20">再为新方案安排未参与修改的独立检查。</text>
<path d="M717 550 V585" fill="none" stroke="#1D2433" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="790" font-size="20" font-weight="700">AG-04-03　训练、验证与测试的分工</text><text x="48" y="824" font-size="17">课程原创机制图；正文小实验仅设训练与一次留出检查。</text></g></svg>
