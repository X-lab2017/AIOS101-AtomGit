<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" fill="#F6F3EB"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1D2433}.t{font-size:30px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:22px}.n{font-size:19px;fill:#566070}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5146D9" stroke-width="1.5"/></marker></defs><text x="40" y="55" class="t">一条旅程，带动观察站的五块内容</text><rect x="40" y="95" width="285" height="170" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="64" y="137" class="h">项目档案</text><text x="64" y="177" class="b">辨认对象与用途</text><text x="64" y="210" class="b">找到版本和来源</text><rect x="357" y="95" width="285" height="170" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="381" y="137" class="h">理解探究</text><text x="381" y="177" class="b">解释机制与条件</text><text x="381" y="210" class="b">连接已有学习材料</text><rect x="674" y="95" width="285" height="170" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="698" y="137" class="h">AI 创作</text><text x="698" y="177" class="b">打开可读作品</text><text x="698" y="210" class="b">决定自己的下一步</text><path d="M327 180 L353 180" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><path d="M644 180 L670 180" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="340" width="380" height="165" rx="18" fill="#E4F0ED" stroke="#D5D4CF"/><text x="119" y="382" class="h">开放协作</text><text x="119" y="422" class="b">留下问题、依据和修订</text><text x="119" y="455" class="b">真实反馈随实践逐步增加</text><rect x="525" y="340" width="380" height="165" rx="18" fill="#EAE7FA" stroke="#D5D4CF"/><text x="549" y="382" class="h">个人积累</text><text x="549" y="422" class="b">从实际决定提炼方法</text><text x="549" y="455" class="b">用作品说明能力与边界</text><path d="M810 268 L810 315" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><path d="M810 315 L710 335" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><path d="M190 268 L190 335" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="570" class="h">本版先贯通：选项目 → 查依据 → 读作品 → 找下一步</text><text x="60" y="617" class="b">五块是成长结构，不是一次填满的栏目。</text><text x="60" y="660" class="n">作者教学设计 · 不表示已有运行或用户反馈</text></svg>