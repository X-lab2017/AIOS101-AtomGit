<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" role="img" aria-labelledby="t d">
<title id="t">需要、作品与检验要对得上</title><desc id="d">从分不清生成和保存的困惑，选择讲清一次材料任务的作品，再用有回答但没有文件的新情境检查理解。更多装饰不能代替这一关系。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10" fill="none" stroke="#5146D9" stroke-width="1.5"/></marker></defs>
<rect width="800" height="960" fill="#F6F3EB"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433">
<text x="56" y="72" font-size="24" fill="#5146D9" letter-spacing="3">一个问题，贯穿一次创作</text>
<path d="M55 95 Q360 92 745 95" stroke="#1D2433" fill="none"/>
<rect x="56" y="125" width="688" height="176" rx="16" fill="#ECE8FA" stroke="#5146D9" stroke-width="2"/>
<text x="84" y="174" font-size="34" font-weight="700">需要：读者卡在哪里？</text>
<text x="84" y="222" font-size="29">读过 DSH 简介，却把</text><text x="84" y="264" font-size="29">“生成文字”和“保存文件”混在一起。</text>
<path d="M400 308 L400 352" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="56" y="375" width="688" height="176" rx="16" fill="#FFFDF7" stroke="#1D2433" stroke-width="2"/>
<text x="84" y="424" font-size="34" font-weight="700">作品：哪种解释能帮忙？</text>
<text x="84" y="472" font-size="29">沿一个材料整理任务，</text><text x="84" y="514" font-size="29">讲清模型、工具与人的不同职责。</text>
<path d="M400 558 L400 602" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="56" y="625" width="688" height="212" rx="16" fill="#E5EFEB" stroke="#3F958D" stroke-width="2"/>
<text x="84" y="674" font-size="34" font-weight="700">检验：换个情境，还会判断吗？</text>
<text x="84" y="722" font-size="29">聊天里已有导览，文件却不存在。</text><text x="84" y="764" font-size="29">请读者解释：还缺什么动作？</text><text x="84" y="806" font-size="26" fill="#3F655E">检查理解，不只是能否背出术语。</text>
<text x="56" y="900" font-size="26">多加一个动画，并不会自动补上这条联系。</text>
</g></svg>