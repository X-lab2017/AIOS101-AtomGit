<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">让任务、作品安排与检查对应</title><desc id="desc">三行分别对应阅读选择、来源回查与适用条件。每项作品安排都对应一个可检查的读者任务。</desc><rect width="1000" height="720" rx="20" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433"><text x="40" y="56" font-size="30" font-weight="700">让每一项设计，都能回到读者任务</text><text x="56" y="126" font-size="26" font-weight="700">读者要完成什么</text><text x="376" y="126" font-size="26" font-weight="700">作品怎样帮助</text><text x="696" y="126" font-size="26" font-weight="700">怎样检查</text><rect x="40" y="155" width="280" height="126" rx="14" fill="#EBE7FB" stroke="#CDC9C0"/><text x="58" y="201" font-size="26">选择下一份资料</text><text x="58" y="243" font-size="26">依据自己的问题</text><path d="M 328 218 h 22 m -7 -7 l 7 7 -7 7" stroke="#5146D9" stroke-width="2" fill="none"/><rect x="360" y="155" width="280" height="126" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="378" y="201" font-size="26">比较训练与推理</text><text x="378" y="243" font-size="26">说明各自阅读用途</text><path d="M 648 218 h 22 m -7 -7 l 7 7 -7 7" stroke="#5146D9" stroke-width="2" fill="none"/><rect x="680" y="155" width="280" height="126" rx="14" fill="#DDEFE9" stroke="#CDC9C0"/><text x="698" y="201" font-size="26">指出一个入口</text><text x="698" y="243" font-size="26">解释选择理由</text><rect x="40" y="310" width="280" height="126" rx="14" fill="#EBE7FB" stroke="#CDC9C0"/><text x="58" y="356" font-size="26">回到原文查证</text><text x="58" y="398" font-size="26">知道信息从哪里来</text><path d="M 328 373 h 22 m -7 -7 l 7 7 -7 7" stroke="#5146D9" stroke-width="2" fill="none"/><rect x="360" y="310" width="280" height="126" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="378" y="356" font-size="26">标出文件与版本</text><text x="378" y="398" font-size="26">让出处对应说法</text><path d="M 648 373 h 22 m -7 -7 l 7 7 -7 7" stroke="#5146D9" stroke-width="2" fill="none"/><rect x="680" y="310" width="280" height="126" rx="14" fill="#DDEFE9" stroke="#CDC9C0"/><text x="698" y="356" font-size="26">找到对应材料</text><text x="698" y="398" font-size="26">核对具体依据</text><rect x="40" y="465" width="280" height="126" rx="14" fill="#EBE7FB" stroke="#CDC9C0"/><text x="58" y="511" font-size="26">决定下一步行动</text><text x="58" y="553" font-size="26">知道已有与未知</text><path d="M 328 528 h 22 m -7 -7 l 7 7 -7 7" stroke="#5146D9" stroke-width="2" fill="none"/><rect x="360" y="465" width="280" height="126" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="378" y="511" font-size="26">说明范围和条件</text><text x="378" y="553" font-size="26">标出尚未验证项</text><path d="M 648 528 h 22 m -7 -7 l 7 7 -7 7" stroke="#5146D9" stroke-width="2" fill="none"/><rect x="680" y="465" width="280" height="126" rx="14" fill="#DDEFE9" stroke="#CDC9C0"/><text x="698" y="511" font-size="26">区分阅读与运行</text><text x="698" y="553" font-size="26">识别额外的承诺</text><text x="40" y="674" font-size="24" fill="#565D6A">同一用途贯穿方案；有新证据时，再调整范围与标准。</text></g></svg>
