<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">先调整，再锁定，最后检验</title><desc id="desc">同一套规则，也要面对没有参与调整的新样本。 ① 用 A、B、C 比较候选参数，规则：预计秒数 = a × 字数 ÷ 100，比较 a = 20、30、40；保留误差记录。；② 写下参数与预测，不再改动，锁定 a 后，预测 D（150 字）与 E（250 字）。，先留下答案，再打开参考时间。；③ 对照新样本，说明适用范围，记录预测与参考时间相差多少秒。，若据此再调整，下一次需要另外的新样本。。教学设计数据；不是实际读者测量或模型性能评测。</desc><rect width="1080" height="1080" fill="#F6F3EB"/><rect x="30" y="30" width="1020" height="1020" rx="12" fill="#FEFCF6" stroke="#C5C0B2"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#1D2433"><text x="70" y="110" font-size="44" font-weight="700">先调整，再锁定，最后检验</text><text x="70" y="170" font-size="28" fill="#626878">同一套规则，也要面对没有参与调整的新样本。</text><rect x="70" y="215" width="940" height="196" rx="14" fill="#5146D9" fill-opacity="0.07"/><rect x="70" y="215" width="10" height="196" fill="#5146D9"/><text x="104" y="266" font-size="36" font-weight="700">① 用 A、B、C 比较候选参数</text><text x="104" y="318" font-size="29">规则：预计秒数 = a × 字数 ÷ 100</text><text x="104" y="368" font-size="29">比较 a = 20、30、40；保留误差记录。</text><rect x="70" y="445" width="940" height="196" rx="14" fill="#3F958D" fill-opacity="0.07"/><rect x="70" y="445" width="10" height="196" fill="#3F958D"/><text x="104" y="496" font-size="36" font-weight="700">② 写下参数与预测，不再改动</text><text x="104" y="548" font-size="29">锁定 a 后，预测 D（150 字）与 E（250 字）。</text><text x="104" y="598" font-size="29">先留下答案，再打开参考时间。</text><rect x="70" y="675" width="940" height="196" rx="14" fill="#F27A59" fill-opacity="0.07"/><rect x="70" y="675" width="10" height="196" fill="#F27A59"/><text x="104" y="726" font-size="36" font-weight="700">③ 对照新样本，说明适用范围</text><text x="104" y="778" font-size="29">记录预测与参考时间相差多少秒。</text><text x="104" y="828" font-size="29">若据此再调整，下一次需要另外的新样本。</text><text x="70" y="985" font-size="26" fill="#626878">教学设计数据；不是实际读者测量或模型性能评测。</text></g></svg>