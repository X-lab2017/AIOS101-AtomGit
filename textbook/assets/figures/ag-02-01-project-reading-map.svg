<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="770" viewBox="0 0 1040 770" font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1040" height="770" rx="0" fill="#FFFDFA" stroke="none"/><text x="42" y="62" font-size="32" fill="#1D2433" font-weight="700">带着问题，选择材料</text><text x="42" y="103" font-size="22" fill="#626777">先找到能够回答问题的地方，再向相关材料扩展。</text><rect x="35" y="136" width="970" height="117" rx="14" fill="#F1F0F7" stroke="none"/><text x="60" y="176" font-size="25" fill="#5146D9" font-weight="700">01</text><text x="125" y="176" font-size="26" fill="#1D2433" font-weight="700">这是什么？</text><text x="410" y="176" font-size="25" fill="#5146D9" font-weight="700">README / 模型卡</text><text x="125" y="220" font-size="24" fill="#1D2433">定位目标、用途和继续阅读的入口</text><rect x="35" y="273" width="970" height="117" rx="14" fill="#EEF5F2" stroke="none"/><text x="60" y="313" font-size="25" fill="#5146D9" font-weight="700">02</text><text x="125" y="313" font-size="26" fill="#1D2433" font-weight="700">怎样形成？</text><text x="410" y="313" font-size="25" fill="#5146D9" font-weight="700">方法说明 / 技术报告</text><text x="125" y="357" font-size="24" fill="#1D2433">理解模型来源、训练方法与评估条件</text><rect x="35" y="410" width="970" height="117" rx="14" fill="#F1F0F7" stroke="none"/><text x="60" y="450" font-size="25" fill="#5146D9" font-weight="700">03</text><text x="125" y="450" font-size="26" fill="#1D2433" font-weight="700">怎样使用？</text><text x="410" y="450" font-size="25" fill="#5146D9" font-weight="700">文件目录 / 运行文档</text><text x="125" y="494" font-size="24" fill="#1D2433">辨认权重、配置，以及实际运行所需条件</text><rect x="35" y="547" width="970" height="117" rx="14" fill="#EEF5F2" stroke="none"/><text x="60" y="587" font-size="25" fill="#5146D9" font-weight="700">04</text><text x="125" y="587" font-size="26" fill="#1D2433" font-weight="700">怎样共同建设？</text><text x="410" y="587" font-size="25" fill="#5146D9" font-weight="700">贡献指南 / 讨论记录</text><text x="125" y="631" font-size="24" fill="#1D2433">认识问题反馈、文档、插件与代码等工作</text><text x="48" y="724" font-size="23" fill="#3F958D">许可文件：为后续复用保存入口，第三章继续阅读。</text></svg>