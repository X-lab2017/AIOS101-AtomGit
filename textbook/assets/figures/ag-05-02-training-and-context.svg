<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1100" viewBox="0 0 880 1100" role="img"><title>训练调整参数，使用时由已有参数处理当前上下文</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1D2433"/></marker></defs><rect width="100%" height="100%" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="68" font-size="40" fill="#5146D9" font-weight="700" text-anchor="start">训练时</text><text x="48" y="111" font-size="30" fill="#1D2433" font-weight="400" text-anchor="start">用样本与反馈调整模型</text><rect x="48" y="148" width="784" height="126" rx="16" fill="#ECEAFB" stroke="#5146D9" stroke-width="2"/><text x="440" y="201" font-size="36" fill="#1D2433" font-weight="400" text-anchor="middle">样本 → 预测 → 比较目标</text><text x="440" y="248" font-size="32" fill="#5146D9" font-weight="700" text-anchor="middle">据此反复调整参数</text><path d="M440 276 L440 325" stroke="#1D2433" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="226" y="342" width="428" height="88" rx="16" fill="#FFF" stroke="#5146D9" stroke-width="2"/><text x="440" y="399" font-size="36" fill="#5146D9" font-weight="700" text-anchor="middle">训练得到的参数</text><path d="M48 474H832" stroke="#1D2433" stroke-opacity=".25" stroke-width="2" stroke-dasharray="8 9"/><text x="48" y="536" font-size="40" fill="#3F958D" font-weight="700" text-anchor="start">使用时</text><text x="48" y="581" font-size="30" fill="#1D2433" font-weight="400" text-anchor="start">已有参数处理当前输入</text><rect x="48" y="621" width="365" height="150" rx="16" fill="#E9F2EE" stroke="#3F958D" stroke-width="2"/><text x="230" y="678" font-size="32" fill="#3F958D" font-weight="700" text-anchor="middle">当前问题与材料</text><text x="230" y="726" font-size="30" fill="#1D2433" font-weight="400" text-anchor="middle">组成这次上下文</text><rect x="467" y="621" width="365" height="150" rx="16" fill="#ECEAFB" stroke="#5146D9" stroke-width="2"/><text x="650" y="678" font-size="32" fill="#5146D9" font-weight="700" text-anchor="middle">已有模型参数</text><text x="650" y="726" font-size="30" fill="#1D2433" font-weight="400" text-anchor="middle">用于本次计算</text><path d="M230 774V805H650V774" stroke="#1D2433" stroke-width="3" fill="none"/><path d="M440 805V847" stroke="#1D2433" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="226" y="861" width="428" height="90" rx="16" fill="#FFF" stroke="#3F958D" stroke-width="2"/><text x="440" y="920" font-size="36" fill="#3F958D" font-weight="700" text-anchor="middle">逐步生成回答</text><text x="440" y="1010" font-size="32" fill="#1D2433" font-weight="400" text-anchor="middle">补材料通常改变当前输入</text><text x="440" y="1058" font-size="32" fill="#F27A59" font-weight="700" text-anchor="middle">不等于重新训练基础模型</text></g></svg>
