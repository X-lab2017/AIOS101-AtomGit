<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1010" viewBox="0 0 880 1010" role="img" aria-labelledby="title desc"><title id="title">模型、工具与运行系统怎样协作</title><desc id="desc">运行系统依据任务构造上下文，模型生成工具请求，工具读取或改变环境，结果返回系统支持下一步；人核对范围与成果。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#1D2433" stroke-width="1.4"/></marker></defs><rect width="880" height="1010" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433"><text x="48" y="61" font-size="27" font-weight="700">从生成请求到可检查的行动</text>
<rect x="48" y="106" width="784" height="92" rx="12" fill="#fff" stroke="#CCC6BA"/><text x="72" y="144" font-size="23" font-weight="700">人：确定目的、范围与完成标准</text><text x="72" y="177" font-size="20">任务进行中核对重要决定，完成后检查成果与依据</text>
<rect x="48" y="245" width="784" height="510" rx="18" fill="#F0ECFC" stroke="#5146D9" stroke-width="2"/><text x="72" y="287" font-size="24" font-weight="700">运行系统</text><text x="72" y="322" font-size="20">组织上下文 · 调度与权限 · 保存状态 · 判断是否继续</text>
<rect x="85" y="380" width="295" height="115" rx="12" fill="#fff" stroke="#5146D9"/><text x="232" y="425" text-anchor="middle" font-size="24" font-weight="700">模型</text><text x="232" y="462" text-anchor="middle" font-size="20">生成内容或工具请求</text>
<rect x="500" y="380" width="295" height="115" rx="12" fill="#fff" stroke="#3F958D"/><text x="647" y="425" text-anchor="middle" font-size="24" font-weight="700">工具接口</text><text x="647" y="462" text-anchor="middle" font-size="20">读取、写入与其他操作</text>
<path d="M380 414 H500" stroke="#1D2433" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="440" y="392" font-size="17" text-anchor="middle">检查请求</text>
<path d="M500 475 H380" stroke="#1D2433" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="440" y="514" font-size="17" text-anchor="middle">结果入上下文</text>
<rect x="85" y="570" width="330" height="130" rx="12" fill="#fff" stroke="#CCC6BA"/><text x="109" y="610" font-size="22" font-weight="700">本次上下文</text><text x="109" y="645" font-size="20">指令、材料、历史、返回</text><text x="109" y="679" font-size="19">依据观察更新，而非整个环境</text><path d="M232 570 V495" fill="none" stroke="#1D2433" stroke-width="2" marker-end="url(#a)"/>
<rect x="500" y="810" width="295" height="85" rx="12" fill="#DDEDE7" stroke="#3F958D"/><text x="647" y="846" font-size="23" text-anchor="middle" font-weight="700">环境</text><text x="647" y="878" font-size="19" text-anchor="middle">工作区文件 / 外部服务</text>
<path d="M610 495 V810" fill="none" stroke="#1D2433" stroke-width="2" marker-end="url(#a)"/><path d="M696 810 V495" fill="none" stroke="#1D2433" stroke-width="2" marker-end="url(#a)"/><text x="570" y="640" font-size="19" text-anchor="end">操作</text><text x="732" y="640" font-size="19">观察</text>
<path d="M440 198 V245" fill="none" stroke="#1D2433" stroke-width="2" marker-end="url(#a)"/><text x="48" y="948" font-size="20" font-weight="700">AG-06-03　模型、工具与运行系统怎样协作</text><text x="48" y="982" font-size="17">课程原创机制图；通用职责示意，非某一产品的完整架构。</text></g></svg>
