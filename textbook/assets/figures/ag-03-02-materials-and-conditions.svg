<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530" role="img" aria-labelledby="title desc"><title id="title">同一份作品中的材料，需要分别确认条件</title><desc id="desc">五类材料分别核对。自己的新增内容另作说明。</desc><rect width="760" height="530" fill="#faf9f5"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#1d2433"><text x="32" y="46" font-size="20" font-weight="700">选定一项材料，寻找与它对应的说明</text><path d="M32 66H728" stroke="#5146d9" stroke-width="2"/><rect x="32" y="82" width="4" height="48" fill="#5146d9"/><text x="53" y="107" font-size="19" font-weight="700">程序代码</text><text x="246" y="107" font-size="18">具体文件、许可与第三方声明</text><path d="M32 142H728" stroke="#d8d7df"/><rect x="32" y="155" width="4" height="48" fill="#3f958d"/><text x="53" y="180" font-size="19" font-weight="700">模型权重</text><text x="246" y="180" font-size="18">确切条目、权重与上游说明</text><path d="M32 215H728" stroke="#d8d7df"/><rect x="32" y="228" width="4" height="48" fill="#a74831"/><text x="53" y="253" font-size="19" font-weight="700">数据材料</text><text x="246" y="253" font-size="18">数据集来源、范围与使用条件</text><path d="M32 288H728" stroke="#d8d7df"/><rect x="32" y="301" width="4" height="48" fill="#5146d9"/><text x="53" y="326" font-size="19" font-weight="700">外来图文</text><text x="246" y="326" font-size="18">作者、出处与对应授权</text><path d="M32 361H728" stroke="#d8d7df"/><rect x="32" y="374" width="4" height="48" fill="#3f958d"/><text x="53" y="399" font-size="19" font-weight="700">AI 输出</text><text x="246" y="399" font-size="18">输入来源、输出内容与服务约定</text><path d="M32 434H728" stroke="#d8d7df"/><text x="32" y="488" font-size="18" fill="#585961">自己的新增内容另作说明；未知项保留具体处理安排。</text></g></svg>
