<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc"><title id="title">能帮助理解，不等于完整复现</title><desc id="desc">小实验是一扇窗口，不是一台缩小的大语言模型。 共同点：从例子中调整可变数值，先明确任务，用误差或损失比较表现。，学习过的材料与新的检验材料要分开。；不同点：任务、规模与训练过程，本章手动调整 1 个数，预测阅读秒数。，语言模型处理词元，训练涉及大量参数与步骤。；使用时：看对象，也看证据，调用 DSH 或聊天服务，不等于重新训练模型。，本章结果不能证明 DeepSeek 的能力或局限。。训练、实际使用、教学演示：三类证据分别记录。</desc><rect width="1080" height="1080" fill="#F6F3EB"/><rect x="30" y="30" width="1020" height="1020" rx="12" fill="#FEFCF6" stroke="#C5C0B2"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#1D2433"><text x="70" y="110" font-size="44" font-weight="700">能帮助理解，不等于完整复现</text><text x="70" y="170" font-size="28" fill="#626878">小实验是一扇窗口，不是一台缩小的大语言模型。</text><rect x="70" y="215" width="940" height="196" rx="14" fill="#5146D9" fill-opacity="0.07"/><rect x="70" y="215" width="10" height="196" fill="#5146D9"/><text x="104" y="266" font-size="36" font-weight="700">共同点：从例子中调整可变数值</text><text x="104" y="318" font-size="29">先明确任务，用误差或损失比较表现。</text><text x="104" y="368" font-size="29">学习过的材料与新的检验材料要分开。</text><rect x="70" y="445" width="940" height="196" rx="14" fill="#3F958D" fill-opacity="0.07"/><rect x="70" y="445" width="10" height="196" fill="#3F958D"/><text x="104" y="496" font-size="36" font-weight="700">不同点：任务、规模与训练过程</text><text x="104" y="548" font-size="29">本章手动调整 1 个数，预测阅读秒数。</text><text x="104" y="598" font-size="29">语言模型处理词元，训练涉及大量参数与步骤。</text><rect x="70" y="675" width="940" height="196" rx="14" fill="#F27A59" fill-opacity="0.07"/><rect x="70" y="675" width="10" height="196" fill="#F27A59"/><text x="104" y="726" font-size="36" font-weight="700">使用时：看对象，也看证据</text><text x="104" y="778" font-size="29">调用 DSH 或聊天服务，不等于重新训练模型。</text><text x="104" y="828" font-size="29">本章结果不能证明 DeepSeek 的能力或局限。</text><text x="70" y="985" font-size="26" fill="#626878">训练、实际使用、教学演示：三类证据分别记录。</text></g></svg>