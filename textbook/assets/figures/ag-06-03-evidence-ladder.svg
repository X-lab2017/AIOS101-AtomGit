<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1100" viewBox="0 0 880 1100" role="img" aria-labelledby="title desc"><title id="title">“完成”要由不同证据共同支持</title><desc id="desc">每一层回答不同的问题，不能相互替代</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5146D9" stroke-width="1.5"/></marker></defs><rect width="880" height="1100" rx="24" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#1D2433"><text x="58" y="80" font-size="36" font-weight="700">“完成”要由不同证据共同支持</text><text x="58" y="126" font-size="23">每一层回答不同的问题，不能相互替代</text><rect x="58" y="170" width="764" height="152" rx="18" fill="white" stroke="#D6D1E9" stroke-width="2"/><text x="86" y="213" font-size="29" font-weight="700">01 文字回答</text><text x="86" y="255" font-size="25">“我准备保存”只是计划。</text><text x="86" y="292" font-size="25">“已保存”仍需找到相应执行证据。</text><path d="M440,328 v24" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="58" y="360" width="764" height="152" rx="18" fill="white" stroke="#D6D1E9" stroke-width="2"/><text x="86" y="403" font-size="29" font-weight="700">02 工具结果</text><text x="86" y="445" font-size="25">请求被接受，不等于内容已经正确。</text><text x="86" y="482" font-size="25">核对返回状态、路径与报错信息。</text><path d="M440,518 v24" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="58" y="550" width="764" height="152" rx="18" fill="white" stroke="#D6D1E9" stroke-width="2"/><text x="86" y="593" font-size="29" font-weight="700">03 实际文件</text><text x="86" y="635" font-size="25">在约定位置重新打开候选稿。</text><text x="86" y="672" font-size="25">检查内容确实存在，原稿没有被覆盖。</text><path d="M440,708 v24" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="58" y="740" width="764" height="152" rx="18" fill="white" stroke="#3F958D" stroke-width="2"/><text x="86" y="783" font-size="29" font-weight="700">04 任务标准</text><text x="86" y="825" font-size="25">回到来源检查关键说法与适用条件。</text><text x="86" y="862" font-size="25">保留人的判断和仍未核验的部分。</text><text x="58" y="985" font-size="24" fill="#5146D9">阅读教学示例，只能证明你完成了阅读与判断。</text><text x="58" y="1027" font-size="24" fill="#5146D9">亲自运行、保存成功、内容核验应分别记录。</text></g></svg>