<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1100" viewBox="0 0 880 1100" role="img" aria-labelledby="title desc"><title id="title">一次行动，先看请求，再看反馈</title><desc id="desc">简化的观察路线，不是 DSH 内部结构或真实日志</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#5146D9" stroke-width="1.5"/></marker></defs><rect width="880" height="1100" rx="24" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#1D2433"><text x="58" y="80" font-size="36" font-weight="700">一次行动，先看请求，再看反馈</text><text x="58" y="126" font-size="23">简化的观察路线，不是 DSH 内部结构或真实日志</text><rect x="58" y="170" width="764" height="152" rx="18" fill="white" stroke="#D6D1E9" stroke-width="2"/><text x="86" y="213" font-size="29" font-weight="700">01 目标与材料</text><text x="86" y="255" font-size="25">人说明：改哪一句，依据哪份材料。</text><text x="86" y="292" font-size="25">模型结合当前上下文提出下一步。</text><path d="M440,328 v24" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="58" y="360" width="764" height="152" rx="18" fill="white" stroke="#D6D1E9" stroke-width="2"/><text x="86" y="403" font-size="29" font-weight="700">02 工具请求与权限</text><text x="86" y="445" font-size="25">请求说明：对哪个文件做什么。</text><text x="86" y="482" font-size="25">系统按策略处理；需授权时由人决定。</text><path d="M440,518 v24" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="58" y="550" width="764" height="152" rx="18" fill="white" stroke="#D6D1E9" stroke-width="2"/><text x="86" y="593" font-size="29" font-weight="700">03 执行与返回</text><text x="86" y="635" font-size="25">工具返回内容、成功信息或错误。</text><text x="86" y="672" font-size="25">被拒绝、失败、未确认，都不是完成。</text><path d="M440,708 v24" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="58" y="740" width="764" height="152" rx="18" fill="white" stroke="#3F958D" stroke-width="2"/><text x="86" y="783" font-size="29" font-weight="700">04 继续、修正或停止</text><text x="86" y="825" font-size="25">返回结果可进入下一轮上下文。</text><text x="86" y="862" font-size="25">人检查产物；必要时重新明确任务。</text><text x="58" y="985" font-size="24" fill="#5146D9">反馈可以回到前面的步骤，不保证一路成功。</text><text x="58" y="1027" font-size="24" fill="#5146D9">不明操作先停；记录看得见的过程与未知。</text></g></svg>