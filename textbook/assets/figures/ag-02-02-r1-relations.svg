<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="630" viewBox="0 0 1040 630" font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1040" height="630" rx="0" fill="#FFFDFA" stroke="none"/><text x="42" y="59" font-size="30" fill="#1D2433" font-weight="700">同一个新模型，两种不同的来源关系</text><rect x="36" y="101" width="450" height="145" rx="14" fill="#F0EDF9" stroke="none"/><text x="58" y="145" font-size="30" fill="#5146D9" font-weight="700">Qwen2.5-Math-7B</text><text x="58" y="192" font-size="24" fill="#1D2433">已有模型：作为训练起点</text><text x="58" y="224" font-size="21" fill="#626777">提供此前训练形成的参数</text><rect x="554" y="101" width="450" height="145" rx="14" fill="#ECF4F1" stroke="none"/><text x="580" y="145" font-size="30" fill="#3F958D" font-weight="700">DeepSeek-R1</text><text x="580" y="192" font-size="24" fill="#1D2433">生成模型：提供训练样本</text><text x="580" y="224" font-size="21" fill="#626777">通过生成的样本传递信息</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#626777"/></marker></defs><path d="M 260 247 V 302 L 400 355" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#a)"/><path d="M 780 247 V 302 L 640 355" fill="none" stroke="#3F958D" stroke-width="3" marker-end="url(#a)"/><text x="50" y="307" font-size="23" fill="#5146D9">基础模型</text><text x="800" y="307" font-size="23" fill="#3F958D">生成的样本</text><rect x="138" y="365" width="764" height="133" rx="14" fill="#F6F3EB" stroke="#CEC9DD"/><text x="170" y="411" font-size="30" fill="#1D2433" font-weight="700">DeepSeek-R1-Distill-Qwen-7B</text><text x="170" y="455" font-size="25" fill="#1D2433">以 Qwen 为基础，利用 R1 样本进行微调</text><text x="50" y="550" font-size="24" fill="#626777">关系来自项目原文，箭头不表示性能优劣。</text><text x="50" y="590" font-size="23" fill="#626777">图中只展示本章解释所需的两种联系。</text></svg>