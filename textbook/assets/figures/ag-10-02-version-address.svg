<svg xmlns="http://www.w3.org/2000/svg" width="800" height="980" viewBox="0 0 800 980" role="img" aria-labelledby="title desc"><title id="title">当前入口与固定版本各有用途</title><desc id="desc">三次提交从 A 到 C 演进。固定提交 B 对应当时内容，当前入口显示最新 C，未来会变化。</desc><rect width="800" height="980" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="34" fill="#1D2433" font-weight="700">同一座观察站，两种地址</text><text x="48" y="104" font-size="26" fill="#1D2433" font-weight="400">一个跟随更新，一个回到当时。</text><text x="65" y="164" font-size="25" fill="#5146D9" font-weight="700">提交历史</text><path d="M100 202 L100 580" stroke="#5146D9" stroke-width="3" fill="none"/><circle cx="100" cy="220" r="15" fill="#5146D9"/><rect x="145" y="178" width="585" height="112" rx="12" fill="#FFFFFF" stroke="#1D2433" stroke-width="2"/><text x="170" y="220" font-size="30" fill="#1D2433" font-weight="700">A · 整理入口</text><text x="170" y="260" font-size="25" fill="#1D2433" font-weight="400">项目、来源与作品已连接</text><circle cx="100" cy="375" r="15" fill="#5146D9"/><rect x="145" y="333" width="585" height="112" rx="12" fill="#FFFFFF" stroke="#1D2433" stroke-width="2"/><text x="170" y="375" font-size="30" fill="#1D2433" font-weight="700">B · 修改条件说明</text><text x="170" y="415" font-size="25" fill="#1D2433" font-weight="400">让读者在行动前看见条件</text><circle cx="100" cy="530" r="15" fill="#5146D9"/><rect x="145" y="488" width="585" height="112" rx="12" fill="#FFFFFF" stroke="#1D2433" stroke-width="2"/><text x="170" y="530" font-size="30" fill="#1D2433" font-weight="700">C · 补充作品入口</text><text x="170" y="570" font-size="25" fill="#1D2433" font-weight="400">新版本继续成长</text><path d="M715 375 L760 375" stroke="#3F958D" stroke-width="3" fill="none"/><path d="M760 375 L760 655" stroke="#3F958D" stroke-width="3" fill="none"/><rect x="48" y="620" width="640" height="118" rx="12" fill="#E8F0EB" stroke="#3F958D" stroke-width="2"/><text x="72" y="661" font-size="29" fill="#24675F" font-weight="700">固定提交 B 的入口</text><text x="72" y="702" font-size="26" fill="#1D2433" font-weight="400">评审同一版；之后继续修改不改变 B。</text><path d="M760 655 L688 655" stroke="#3F958D" stroke-width="3" fill="none"/><rect x="48" y="770" width="704" height="118" rx="12" fill="#EBE8FA" stroke="#5146D9" stroke-width="2"/><text x="72" y="812" font-size="29" fill="#5146D9" font-weight="700">当前入口：此刻指向 C</text><text x="72" y="854" font-size="26" fill="#1D2433" font-weight="400">日常阅读；后续提交会带来新内容。</text><text x="48" y="938" font-size="23" fill="#1D2433" font-weight="400">A / B / C 为教学标识，不是真实提交编号。</text></g></svg>