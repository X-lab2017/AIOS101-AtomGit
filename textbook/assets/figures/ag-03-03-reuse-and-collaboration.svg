<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc"><title id="title">复用与共同改进：材料、适配、评审和反馈</title><desc id="desc">既有成果经过理解与适配进入自己的任务，可以进一步提出改进，由评审与整合进入共同成果，再为下一次复用提供材料。</desc><rect width="760" height="480" fill="#faf9f5"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#1d2433"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5146d9"/></marker></defs><rect x="36" y="46" width="280" height="108" rx="8" fill="#f0edf9" stroke="#c8c4d4"/><text x="176" y="85" text-anchor="middle" font-size="20" font-weight="700">已有成果与说明</text><text x="176" y="122" text-anchor="middle" font-size="17">材料、版本与使用条件</text><rect x="444" y="46" width="280" height="108" rx="8" fill="#edf6f3" stroke="#c8c4d4"/><text x="584" y="85" text-anchor="middle" font-size="20" font-weight="700">用于自己的任务</text><text x="584" y="122" text-anchor="middle" font-size="17">理解、适配并检查结果</text><rect x="444" y="286" width="280" height="108" rx="8" fill="#f7f0e9" stroke="#c8c4d4"/><text x="584" y="325" text-anchor="middle" font-size="20" font-weight="700">提出具体改进</text><text x="584" y="362" text-anchor="middle" font-size="17">说明问题、依据与变化</text><rect x="36" y="286" width="280" height="108" rx="8" fill="#f0edf9" stroke="#c8c4d4"/><text x="176" y="325" text-anchor="middle" font-size="20" font-weight="700">更新共同成果</text><text x="176" y="362" text-anchor="middle" font-size="17">整合、说明并持续维护</text><path d="M324 100H436" fill="none" stroke="#5146d9" stroke-width="2" marker-end="url(#arrow)"/><path d="M584 162V278" fill="none" stroke="#5146d9" stroke-width="2" marker-end="url(#arrow)"/><path d="M436 340H324" fill="none" stroke="#5146d9" stroke-width="2" marker-end="url(#arrow)"/><path d="M176 278V162" fill="none" stroke="#5146d9" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="78" text-anchor="middle" font-size="16">理解与适配</text><text x="600" y="215" font-size="16">选择参与</text><text x="380" y="318" text-anchor="middle" font-size="16">评审与整合</text><text x="192" y="215" font-size="16">继续复用</text><text x="380" y="441" text-anchor="middle" font-size="17">实际反馈可推动再次理解与修改；复用不必都回到原项目。</text></g></svg>
