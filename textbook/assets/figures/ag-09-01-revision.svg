<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">按同一标准比较修订前后</title><desc id="desc">资源身份、入口承诺和评价依据三项标准保持相同。修订纠正配套资源被说成全文、目录被说成实验入口、AI 高分被说成质量保证的问题。材料核验不代表真人试读。</desc><rect width="1000" height="720" rx="20" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433"><text x="40" y="56" font-size="30" font-weight="700">修订是否有效，回到同一项标准</text><text x="52" y="120" font-size="27" font-weight="700">检查标准</text><text x="292" y="120" font-size="27" font-weight="700">V0：待改作品</text><text x="662" y="120" font-size="27" font-weight="700">V1：参考修订</text><rect x="40" y="145" width="205" height="118" rx="14" fill="#EBE7FB" stroke="#CDC9C0"/><text x="58" y="191" font-size="26">资源身份</text><rect x="280" y="145" width="330" height="118" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="298" y="191" font-size="26">配套资源被说成</text><text x="298" y="231" font-size="26">完整开源正文</text><rect x="650" y="145" width="310" height="118" rx="14" fill="#DDEFE9" stroke="#CDC9C0"/><text x="668" y="191" font-size="26">说明配套性质</text><text x="668" y="231" font-size="26">保留来源与范围</text><path d="M618 205h24m-7-7l7 7-7 7" fill="none" stroke="#5146D9" stroke-width="2"/><rect x="40" y="291" width="205" height="118" rx="14" fill="#EBE7FB" stroke="#CDC9C0"/><text x="58" y="337" font-size="26">入口承诺</text><rect x="280" y="291" width="330" height="118" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="298" y="337" font-size="26">目录被说成实验</text><text x="298" y="377" font-size="26">摘要被说成全文</text><rect x="650" y="291" width="310" height="118" rx="14" fill="#DDEFE9" stroke="#CDC9C0"/><text x="668" y="337" font-size="26">查看主题安排</text><text x="668" y="377" font-size="26">回顾章节要点</text><path d="M618 351h24m-7-7l7 7-7 7" fill="none" stroke="#5146D9" stroke-width="2"/><rect x="40" y="437" width="205" height="118" rx="14" fill="#EBE7FB" stroke="#CDC9C0"/><text x="58" y="483" font-size="26">评价依据</text><rect x="280" y="437" width="330" height="118" rx="14" fill="#FFFFFF" stroke="#CDC9C0"/><text x="298" y="483" font-size="26">一次 AI 高分</text><text x="298" y="523" font-size="26">被说成质量保证</text><rect x="650" y="437" width="310" height="118" rx="14" fill="#DDEFE9" stroke="#CDC9C0"/><text x="668" y="483" font-size="26">按材料核验</text><text x="668" y="523" font-size="26">用任务作走查</text><path d="M618 497h24m-7-7l7 7-7 7" fill="none" stroke="#5146D9" stroke-width="2"/><text x="40" y="634" font-size="24" fill="#565D6A">教学对照：可核对文字与材料是否一致。</text><text x="40" y="674" font-size="24" fill="#565D6A">作者自查、AI 建议、真人试读分别记录，不互相替代。</text></g></svg>
