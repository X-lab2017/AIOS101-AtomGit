<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" role="img" aria-labelledby="t d">
<title id="t">修订要补上读者缺少的关系</title><desc id="d">作者原片段只说读取、生成、核验，缺执行者和结果位置。修订区分工具读取、模型形成文字、工具保存、人打开检查。用有回答但没有文件的同一问题复查，并不声称真实读者已通过。</desc>
<rect width="800" height="1100" fill="#F6F3EB"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#1D2433">
<text x="56" y="66" font-size="27" fill="#5146D9">局部修订示例 · 非模型输出或读者反馈</text>
<path d="M60 105 L733 100 L741 300 L56 306 Z" fill="#FFFDF7" stroke="#1D2433" stroke-width="1.5"/>
<text x="84" y="151" font-size="30" font-weight="700">修改前</text>
<text x="84" y="203" font-size="31">“读取材料后生成导览，</text><text x="84" y="249" font-size="31">再进行核验。”</text>
<path d="M102 272 Q389 280 634 269" fill="none" stroke="#F27A59" stroke-width="4"/>
<text x="76" y="353" font-size="27" fill="#8A4130">缺口：谁做？保存到哪里？检查什么？</text>
<path d="M59 393 L741 390 L737 798 L63 802 Z" fill="#E5EFEB" stroke="#3F958D" stroke-width="2"/>
<text x="84" y="443" font-size="30" font-weight="700">修改后：把动作交还给具体角色</text>
<text x="84" y="504" font-size="29"><tspan font-weight="700">工具</tspan>读取指定材料，返回内容。</text>
<path d="M84 524 H706" stroke="#B5CEC6"/>
<text x="84" y="574" font-size="29"><tspan font-weight="700">模型</tspan>据此形成导览文字。</text>
<path d="M84 594 H706" stroke="#B5CEC6"/>
<text x="84" y="644" font-size="29"><tspan font-weight="700">写入工具</tspan>把候选保存到指定文件。</text>
<path d="M84 664 H706" stroke="#B5CEC6"/>
<text x="84" y="714" font-size="29"><tspan font-weight="700">人</tspan>打开文件，检查文字与来源。</text>
<text x="84" y="771" font-size="24" fill="#3F655E">这是讲解顺序，不规定真实任务的步骤数量。</text>
<rect x="56" y="846" width="688" height="166" rx="12" fill="#ECE8FA" stroke="#5146D9"/>
<text x="84" y="894" font-size="30" font-weight="700">用同一个问题复查</text>
<text x="84" y="940" font-size="29">聊天里有文字，文件却不存在。</text>
<text x="84" y="982" font-size="29">作品是否解释了还缺什么？</text>
<text x="56" y="1061" font-size="25">补齐说明，可直接核对；读者理解，仍需实际观察。</text>
</g></svg>
