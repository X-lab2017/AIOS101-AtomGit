<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720"><rect width="1000" height="720" fill="#F6F3EB"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#1D2433}.t{font-size:30px;font-weight:700}.h{font-size:25px;font-weight:700}.b{font-size:22px}.n{font-size:19px;fill:#566070}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#5146D9" stroke-width="1.5"/></marker></defs><text x="40" y="55" class="t">修订入口，要回到同一个用户任务</text><rect x="40" y="100" width="435" height="220" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="64" y="142" class="h">原构想：作者怎样收纳</text><text x="64" y="182" class="b">项目资料</text><text x="64" y="215" class="b">实践成果</text><text x="64" y="248" class="b">其他</text><rect x="525" y="100" width="435" height="220" rx="18" fill="#fff" stroke="#D5D4CF"/><text x="549" y="142" class="h">修订：读者想做什么</text><text x="549" y="182" class="b">认识 DSH：用途与条件</text><text x="549" y="215" class="b">先读入门导览</text><text x="549" y="248" class="b">继续看一次文件任务</text><path d="M480 210 L518 210" fill="none" stroke="#5146D9" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="395" width="840" height="145" rx="18" fill="#EAE7FA" stroke="#D5D4CF"/><text x="104" y="437" class="h">复查任务</text><text x="104" y="477" class="b">选择能协助整理材料的观察对象，找到条件和来源，</text><text x="104" y="510" class="b">打开一件可读作品，并说明下一步。</text><text x="80" y="590" class="b">看什么：路径是否明确，目标内容是否匹配，条件是否可见。</text><text x="80" y="635" class="b">不能仅凭文字变长、页面变美，就宣布用户已经会用。</text><text x="80" y="685" class="n">作者对照示例 · 不是实际用户测试结果</text></svg>