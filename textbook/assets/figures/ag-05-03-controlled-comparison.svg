<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1080" viewBox="0 0 880 1080" role="img"><title>固定问题和要求，只改变材料，再按同一标准比较</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#1D2433"/></marker></defs><rect width="100%" height="100%" fill="#F6F3EB"/><g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="48" y="68" font-size="40" fill="#5146D9" font-weight="700" text-anchor="start">固定一个问题</text><text x="48" y="116" font-size="34" fill="#1D2433" font-weight="400" text-anchor="start">打开网页后，能否直接完成任务？</text><rect x="48" y="154" width="784" height="108" rx="16" fill="#FFF" stroke="#D7D3C9" stroke-width="2"/><text x="440" y="199" font-size="32" fill="#1D2433" font-weight="400" text-anchor="middle">相同问题 · 相同回答要求</text><text x="440" y="242" font-size="28" fill="#1D2433" font-weight="400" text-anchor="middle">真实调用时尽量保持同模型与设置</text><path d="M440 264V296H230V330 M440 296H650V330" stroke="#1D2433" stroke-width="3" fill="none"/><rect x="48" y="332" width="365" height="232" rx="16" fill="#ECEAFB" stroke="#5146D9" stroke-width="2"/><text x="230" y="386" font-size="38" fill="#5146D9" font-weight="700" text-anchor="middle">条件 A</text><text x="230" y="447" font-size="36" fill="#1D2433" font-weight="400" text-anchor="middle">项目简介</text><text x="230" y="506" font-size="30" fill="#1D2433" font-weight="400" text-anchor="middle">A1、A2</text><rect x="467" y="332" width="365" height="232" rx="16" fill="#E9F2EE" stroke="#3F958D" stroke-width="2"/><text x="650" y="386" font-size="38" fill="#3F958D" font-weight="700" text-anchor="middle">条件 B</text><text x="650" y="447" font-size="36" fill="#1D2433" font-weight="400" text-anchor="middle">同一简介</text><text x="650" y="505" font-size="28" fill="#3F958D" font-weight="700" text-anchor="middle">＋使用指南 B1—B3</text><path d="M230 568 L230 617" stroke="#1D2433" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M650 568 L650 617" stroke="#1D2433" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="635" width="365" height="90" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><rect x="467" y="635" width="365" height="90" rx="16" fill="#FFFFFF" stroke="#D7D3C9" stroke-width="2"/><text x="230" y="693" font-size="34" fill="#1D2433" font-weight="400" text-anchor="middle">保留结果 A</text><text x="650" y="693" font-size="34" fill="#1D2433" font-weight="400" text-anchor="middle">保留结果 B</text><path d="M230 727V764H650V727" stroke="#1D2433" stroke-width="3" fill="none"/><path d="M440 764V800" stroke="#1D2433" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="816" width="784" height="159" rx="16" fill="#FFF" stroke="#F27A59" stroke-width="2"/><text x="440" y="867" font-size="36" fill="#F27A59" font-weight="700" text-anchor="middle">按同一标准，逐条核对</text><text x="440" y="917" font-size="32" fill="#1D2433" font-weight="400" text-anchor="middle">说法 → 原段 → 条件 → 未知</text><text x="440" y="954" font-size="27" fill="#1D2433" font-weight="400" text-anchor="middle">不预设加入材料后一定更好</text><text x="440" y="1031" font-size="30" fill="#1D2433" font-weight="400" text-anchor="middle">阅读判断与真实调用，分别记录</text></g></svg>
